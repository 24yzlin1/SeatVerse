[project]
name = "seat-verse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pyright>=1.1.407",
    "pytest>=9.2.0",
]

[tool.pyright]
include = ["app", "scripts", "main.py"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

# The `auto` executor of poe 0.49 re-runs tasks via `uv run` inside uv projects;
# when the outer layer is already `uv run poe ...`, the inner uv cannot acquire
# the uv cache lock and fails with `Could not acquire lock ... uv\cache\.lock:
# access is denied`. Pin the virtualenv executor to call the executables inside
# .venv directly, avoiding nested uv.
[tool.poe]
executor.type = "virtualenv"

[tool.poe.tasks]
dev = "uvicorn main:app --reload"
start = "uvicorn main:app"
check = "pyright app scripts main.py"
test = "pytest"
migrate = "python -m scripts.migrate"
seed = "python -m scripts.seed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
