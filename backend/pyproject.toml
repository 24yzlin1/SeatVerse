[project]
name = "seat-verse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = ["httpx>=0.28.1", "mypy>=2.4.1", "poethepoet>=0.49.0", "pytest>=9.2.0"]

[tool.mypy]
strict = true
disallow_any_explicit = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# poe 0.49 的 auto 执行器在 uv 项目里会改用 `uv run` 再跑一遍任务；
# 外层已经是 `uv run poe ...` 时，内层 uv 抢不到 uv 缓存锁，报
# `Could not acquire lock ... uv\cache\.lock: 拒绝访问`。
# 固定用 virtualenv 执行器直接调用 .venv 里的可执行文件，避免嵌套 uv。
[tool.poe]
executor.type = "virtualenv"

[tool.poe.tasks]
dev = "uvicorn main:app --reload"
start = "uvicorn main:app"
check = "mypy app scripts main.py tests"
test = "pytest"
migrate = "python -m scripts.migrate"
seed = "python -m scripts.seed"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
